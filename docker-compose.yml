x-app-env: &app-env
  DATABASE_URL: postgresql://inventaris:${DB_PASSWORD:?Set DB_PASSWORD in .env}@db:5432/inventaris?schema=public
  SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
  SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@example.com}
  SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-admin12345}
  SEED_ON_START: ${SEED_ON_START:-true}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: inventaris
      POSTGRES_USER: inventaris
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventaris"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    command: npm start
    environment: *app-env
    volumes:
      - uploads_data:/app/public/uploads
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
  uploads_data:
